name: Sync Build Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [bepinex5]
    paths:
      - .github/workflows/sync-release.yml

permissions:
  contents: write

concurrency:
  group: hsmod-sync-release
  cancel-in-progress: true

jobs:
  sync-build-release:
    if: github.repository == 'wymtsd/HsMod' && github.ref == 'refs/heads/bepinex5'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: bepinex5
          fetch-depth: 0

      - name: Sync upstream and check published version
        id: upstream
        run: |
          $ErrorActionPreference = 'Stop'
          function Git {
            & git.exe @args
            if ($LASTEXITCODE -ne 0) { throw "git failed: $args" }
          }
          Git config user.name 'github-actions[bot]'
          Git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Git fetch https://github.com/Pik-4/HsMod.git bepinex5
          $upstream = (Git rev-parse FETCH_HEAD).Trim()
          git.exe merge-base --is-ancestor $upstream HEAD
          $ancestry = $LASTEXITCODE
          if ($ancestry -gt 1) { throw 'Could not check upstream ancestry' }
          if ($ancestry -eq 1) {
            # Keep this fork's workflow files; sync all other upstream changes.
            # GITHUB_TOKEN cannot push changes to workflow files.
            git.exe merge --no-commit --no-ff $upstream
            if ($LASTEXITCODE -gt 1) { throw 'Upstream merge failed' }
            Git restore --source=HEAD --staged --worktree -- .github/workflows
            $conflicts = @(Git diff --name-only --diff-filter=U)
            if ($conflicts.Count -gt 0) { throw "Merge conflicts: $conflicts" }
            Git commit -m "Sync Pik-4/HsMod $upstream (preserve fork workflows)"
          }
          Git push origin HEAD:refs/heads/bepinex5
          $target = (Git rev-parse HEAD).Trim()
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $releases = Invoke-RestMethod 'https://api.github.com/repos/BepInEx/BepInEx/releases?per_page=100' -Headers $headers
          $bep = $releases | Where-Object { -not $_.prerelease -and -not $_.draft -and $_.tag_name.StartsWith('v5.') } | Sort-Object { [version]($_.tag_name.TrimStart('v')) } -Descending | Select-Object -First 1
          if (-not $bep) { throw 'No BepInEx 5 release' }
          $asset = @($bep.assets | Where-Object { $_.name -like 'BepInEx_win_x64_*.zip' })
          if ($asset.Count -ne 1) { throw 'Expected one official Windows x64 asset' }
          $asset = $asset[0]
          "bep=$($bep.tag_name)" >> $env:GITHUB_OUTPUT
          "bep_url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          "bep_digest=$($asset.digest)" >> $env:GITHUB_OUTPUT
          $tag = "bundle-v1-$upstream-$($bep.tag_name)-$($asset.id)"
          "sha=$upstream" >> $env:GITHUB_OUTPUT
          "target=$target" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # Distinguish a missing release from an API or permissions failure.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
          }
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GH_REPO/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404) {
            "build=true" >> $env:GITHUB_OUTPUT
          } elseif ($response.StatusCode -eq 200) {
            $release = $response.Content | ConvertFrom-Json
            $dll = @($release.assets | Where-Object { $_.name -eq 'HsMod-Windows-x64.zip' })
            $needed = $release.draft -or $dll.Count -eq 0
            "build=$($needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            if (-not $needed) { "Already published $tag; no build needed." >> $env:GITHUB_STEP_SUMMARY }
          } else {
            throw "Release lookup failed with HTTP $($response.StatusCode)"
          }

      - name: Setup .NET
        if: steps.upstream.outputs.build == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Restore and build
        if: steps.upstream.outputs.build == 'true'
        run: |
          dotnet restore --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build --configuration Release --no-restore -p:PostBuildEvent= -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (-not (Test-Path -LiteralPath HsMod/Release/HsMod.dll)) { throw 'HsMod.dll was not produced' }
          $hash = (Get-FileHash -LiteralPath HsMod/Release/HsMod.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HsMod.dll" | Set-Content -LiteralPath HsMod/Release/SHA256SUMS.txt -Encoding utf8


      - name: Package and verify Windows x64 bundle
        if: steps.upstream.outputs.build == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          TARGET_SHA: ${{ steps.upstream.outputs.target }}
          BEP_VERSION: ${{ steps.upstream.outputs.bep }}
          BEP_URL: ${{ steps.upstream.outputs.bep_url }}
          BEP_DIGEST: ${{ steps.upstream.outputs.bep_digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'clean-package'
          $dist = Join-Path $env:RUNNER_TEMP 'hsmod-dist'
          if (Test-Path $stage) { throw 'Stage must be new' }
          New-Item -ItemType Directory -Path $stage,$dist | Out-Null
          if ($env:BEP_URL -notlike 'https://github.com/BepInEx/BepInEx/releases/download/*') { throw 'Unexpected origin' }
          $archive = "$env:RUNNER_TEMP/bepinex.zip"
          Invoke-WebRequest $env:BEP_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:BEP_DIGEST -and $env:BEP_DIGEST -ne "sha256:$hash") { throw 'BepInEx checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          $ini = "$stage/doorstop_config.ini"
          $text = Get-Content $ini -Raw
          $pattern = '(?m)^\s*dll_search_path_override\s*=.*$'
          if ([regex]::Matches($text,$pattern).Count -ne 1) { throw 'Unexpected config' }
          [regex]::Replace($text,$pattern,'dll_search_path_override = BepInEx\unstripped_corlib') | Set-Content $ini -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$stage/BepInEx/plugins","$stage/BepInEx/unstripped_corlib","$stage/HsMod-Package" | Out-Null
          Copy-Item HsMod/Release/HsMod.dll "$stage/BepInEx/plugins/HsMod.dll"
          $tree = $env:UPSTREAM_SHA + ':HsMod/UnstrippedCorlib'
          $files = @(git.exe ls-tree --name-only $tree)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list corlib' }
          foreach ($name in $files) {
            if ($name -notmatch '^[A-Za-z0-9_.-]+\.dll$') { throw "Unexpected dependency $name" }
          }
          git.exe archive --format=zip --output="$env:RUNNER_TEMP/corlib.zip" $tree
          if ($LASTEXITCODE -ne 0) { throw 'Cannot export corlib' }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/corlib.zip" -DestinationPath "$stage/BepInEx/unstripped_corlib"
          Copy-Item LICENSE.txt "$stage/HsMod-Package/HsMod-LICENSE.txt"
          Invoke-WebRequest "https://raw.githubusercontent.com/BepInEx/BepInEx/$env:BEP_VERSION/LICENSE" -OutFile "$stage/HsMod-Package/BepInEx-LICENSE.txt"
          @(
            'HsMod Windows x64 非官方整合包'
            '关闭游戏，将 ZIP 内所有内容直接解压到 Hearthstone.exe 所在目录，不要额外套一层文件夹。'
            '通过战网正常启动，无需填写账号令牌或编辑 Doorstop 配置。'
            '仅适用于 Windows x64 炉石；安装路径避免中文等非拉丁字符。'
            '已有 Mod/BepInEx 时先备份；本包会替换 winhttp.dll 和 doorstop_config.ini。'
            '本包不含个人配置、游戏日志、账号令牌。首次运行自动生成配置。'
            '已检查结构和依赖，尚未实际启动游戏验证。上游提示国服不能保证账号安全。'
            "HsMod source (AGPL-3.0): https://github.com/$env:GH_REPO/tree/$env:TARGET_SHA"
            "BepInEx source: https://github.com/BepInEx/BepInEx/tree/$env:BEP_VERSION"
            'Public upstream dependency DLLs retain their respective licenses.'
          ) | Set-Content "$stage/HsMod-Package/安装说明.txt" -Encoding utf8
          @{ hsmod_upstream=$env:UPSTREAM_SHA; build_commit=$env:TARGET_SHA; bepinex=$env:BEP_VERSION; official_archive_sha256=$hash; official_download=$env:BEP_URL } | ConvertTo-Json | Set-Content "$stage/HsMod-Package/BUILD.json" -Encoding utf8
          $required = @('winhttp.dll','doorstop_config.ini','BepInEx/core/BepInEx.dll','BepInEx/core/BepInEx.Preloader.dll','BepInEx/plugins/HsMod.dll','BepInEx/unstripped_corlib/mscorlib.dll','BepInEx/unstripped_corlib/System.dll','BepInEx/unstripped_corlib/UniTask.dll')
          foreach ($name in $required) {
            if (-not (Test-Path "$stage/$name" -PathType Leaf)) { throw "Missing $name" }
          }
          $bytes = [IO.File]::ReadAllBytes("$stage/winhttp.dll")
          $pe = [BitConverter]::ToInt32($bytes,60)
          if ([BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x8664) { throw 'Loader not AMD64' }
          $all = @(Get-ChildItem $stage -Recurse -File -Force)
          foreach ($f in $all) {
            $rel = [IO.Path]::GetRelativePath($stage,$f.FullName).Replace('\','/')
            if ($rel -notmatch '^(BepInEx/core/[^/]+\.(dll|xml)|BepInEx/unstripped_corlib/[A-Za-z0-9_.-]+\.dll|BepInEx/plugins/HsMod\.dll|HsMod-Package/[^/]+|winhttp\.dll|doorstop_config\.ini|\.doorstop_version|changelog\.txt)$') { throw "Unexpected file $rel" }
            if ($f.Extension -match '^\.(ini|txt|json|xml)$') {
              $body = Get-Content $f.FullName -Raw
              if ($body -match '(?i)(C:\\Users\\|D:\\a\\|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|PRIVATE KEY)') { throw "Private-data pattern $rel" }
            }
          }
          $zip = "$dist/HsMod-Windows-x64.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip)
          $check = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($name in $required) { if (-not $check.GetEntry($name)) { throw "ZIP missing $name" } }
            if ($check.Entries.Count -ne $all.Count) { throw 'ZIP count mismatch' }
          } finally { $check.Dispose() }
          Copy-Item HsMod/Release/HsMod.dll "$dist/HsMod.dll"
          @('HsMod.dll','HsMod-Windows-x64.zip') | ForEach-Object { "$((Get-FileHash "$dist/$_" -Algorithm SHA256).Hash.ToLowerInvariant())  $_" } | Set-Content "$dist/SHA256SUMS.txt" -Encoding utf8
          "Verified ZIP: $($all.Count) files, x64 loader, corlib and plugin." >> $env:GITHUB_STEP_SUMMARY


      - name: Save DLL and bundle as workflow artifact
        if: steps.upstream.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HsMod-${{ steps.upstream.outputs.sha }}
          path: |
            ${{ runner.temp }}/hsmod-dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Prepare bilingual release notes
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
          TARGET_SHA: ${{ steps.upstream.outputs.target }}
          BEP_VERSION: ${{ steps.upstream.outputs.bep }}
          BUILD_NEEDED: ${{ steps.upstream.outputs.build }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildCommit = $env:TARGET_SHA
          $buildLog = "https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID"
          $existingJson = gh release view "$env:RELEASE_TAG" --json body,targetCommitish
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            $existing = $existingJson | ConvertFrom-Json
            if ($env:BUILD_NEEDED -ne 'true') {
              $match = [regex]::Match($existing.body, 'https://github\.com/[^/\s]+/[^/\s]+/commit/([a-f0-9]{40})')
              # Use the fork's original build commit, not the upstream commit or this notes-only update.
              $forkPattern = 'https://github\.com/' + [regex]::Escape($env:GH_REPO) + '/commit/([a-f0-9]{40})'
              $match = [regex]::Match($existing.body, $forkPattern)
              if (-not $match.Success) { throw 'Original build commit missing from release notes' }
              $buildCommit = $match.Groups[1].Value
              $logPattern = 'https://github\.com/' + [regex]::Escape($env:GH_REPO) + '/actions/runs/[0-9]+'
              $logMatch = [regex]::Match($existing.body, $logPattern)
              if (-not $logMatch.Success) { throw 'Original build log missing from release notes' }
              $buildLog = $logMatch.Value
            }
          }
          $notes = @(
            '## English'
            ''
            'Unofficial automated Windows x64 bundle of Pik-4/HsMod (bepinex5).'
            ''
            '- Download **HsMod-Windows-x64.zip** from Assets below.'
            '- Close the game, extract all ZIP contents directly into the folder containing **Hearthstone.exe**, then launch through Battle.net.'
            '- Includes HsMod, official stable BepInEx 5 Windows x64, required unstripped corlib DLLs, and preconfigured Doorstop paths.'
            '- Back up existing mods first. No personal game configuration, logs, or login tokens are included.'
            '- **HsMod.dll** is also available for DLL-only upgrades; **SHA256SUMS.txt** contains file checksums.'
            ''
            "BepInEx version: **$env:BEP_VERSION**"
            "Upstream commit: https://github.com/Pik-4/HsMod/commit/$env:UPSTREAM_SHA"
            "Build commit: https://github.com/$env:GH_REPO/commit/$buildCommit"
            "Build log: $buildLog"
            ''
            'Compilation and package structure checks passed. In-game startup and compatibility have not been tested.'
            'HsMod license: AGPL-3.0; source is available at the build commit above. Bundled components retain their respective licenses.'
            ''
            '---'
            ''
            '## 简体中文'
            ''
            'Pik-4/HsMod（bepinex5）的 Windows x64 非官方自动构建整合包。'
            ''
            '- 在下方 Assets 下载 **HsMod-Windows-x64.zip**。'
            '- 关闭游戏，将 ZIP 内全部内容直接解压到 **Hearthstone.exe 所在目录**，然后通过战网启动。'
            '- 已包含 HsMod、官方 BepInEx 5 稳定版 Windows x64、必需的 unstripped corlib DLL，以及预设的 Doorstop 路径。'
            '- 已有 Mod 时请先备份。包内不含个人游戏配置、日志或登录令牌。'
            '- **HsMod.dll** 用于单独升级插件；**SHA256SUMS.txt** 提供文件校验值。'
            ''
            "BepInEx 版本：**$env:BEP_VERSION**"
            "上游提交：https://github.com/Pik-4/HsMod/commit/$env:UPSTREAM_SHA"
            "构建提交：https://github.com/$env:GH_REPO/commit/$buildCommit"
            "构建日志：$buildLog"
            ''
            '编译及包结构检查已通过，尚未实际启动游戏验证，不能保证所有客户端版本兼容。'
            'HsMod 采用 AGPL-3.0 许可，源码见上方构建提交；整合的各组件保留各自许可证。'
          )
          $notes | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8
          if ($exists) {
            gh release edit "$env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/release-notes.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not update release notes' }
          }

      - name: Publish unofficial release
        if: steps.upstream.outputs.build == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
          TARGET_SHA: ${{ steps.upstream.outputs.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view "$env:RELEASE_TAG" --json id *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --target "$env:TARGET_SHA" --draft --title "HsMod Windows x64 bundle $($env:UPSTREAM_SHA.Substring(0, 12))" --notes-file "$env:RUNNER_TEMP/release-notes.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          gh release upload "$env:RELEASE_TAG" "$env:RUNNER_TEMP/hsmod-dist/HsMod.dll" "$env:RUNNER_TEMP/hsmod-dist/HsMod-Windows-x64.zip" "$env:RUNNER_TEMP/hsmod-dist/SHA256SUMS.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release files' }
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
          "Published: https://github.com/$env:GH_REPO/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
